# ============================================================
# CI/CD 自动化流水线（M1 雏形，阶段二完善云端部署）
# ============================================================
# 触发器：监听 develop 分支 push 事件
# 流程：
#   1. 编译后端 .NET 项目 → 输出 dll
#   2. 编译前端项目 → 输出 dist/
#   3. 构建 Docker 应用镜像（后端 + 前端 分离）
#   4. （阶段二）推送镜像 → 云端部署
# ============================================================

name: Build & Deploy (M1)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  # ==========================================
  # Job 1：编译后端 .NET 8 项目
  # ==========================================
  build-backend:
    name: build-dotnet
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 NuGet 依赖
        run: dotnet restore template-backend/TemplateDormApi.csproj

      - name: 编译后端项目
        run: dotnet build template-backend/TemplateDormApi.csproj --configuration Release --no-restore

      - name: 发布后端（输出 dll）
        run: dotnet publish template-backend/TemplateDormApi.csproj --configuration Release --output publish/backend

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend/

  # ==========================================
  # Job 2：编译前端 Vue3 项目
  # ==========================================
  build-frontend:
    name: 编译前端
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: |
          cd template-frontend
          npm ci

      - name: 检查并编译前端项目
        run: |
          cd template-frontend
          npm run check

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: template-frontend/dist/

  # ==========================================
  # Job 3：构建 Docker 镜像（阶段二启用）
