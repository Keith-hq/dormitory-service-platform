# ============================================================
# CI 自动化流水线：编译 → 构建镜像 → 发布
# ============================================================
# 触发器：
#   push develop → 编译 + 构建镜像 + 推送 GHCR
#   PR master/develop → 编译 + 构建镜像验证（不推送、不部署）
#
# 流程：
#   1. 编译后端 .NET 项目 → 输出 dll
#   2. 编译前端项目 → 输出 dist/
#   3. 构建 Docker 应用镜像（后端 + 前端）
#   4. 推送镜像到 GitHub Container Registry（仅 develop）
#
# 服务器已过期，生产部署改为按 README 的手工流程执行。
# ============================================================

name: Build & Publish

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: build-develop
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR 要求仓库名全小写：github.repository_owner 会保留原始大小写
  # （Keith-hq）导致 buildx 拒绝，故此处硬编码小写
  API_IMAGE_NAME: keith-hq/dorm-api
  WEB_IMAGE_NAME: keith-hq/dorm-web

jobs:
  # ==========================================
  # Job 1：编译后端 .NET 8 项目
  # ==========================================
  build-backend:
    name: build-dotnet
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 NuGet 依赖
        run: dotnet restore backend/TemplateDormApi.csproj

      - name: 编译后端项目
        run: dotnet build backend/TemplateDormApi.csproj --configuration Release --no-restore

      - name: 发布后端（输出 dll）
        run: dotnet publish backend/TemplateDormApi.csproj --configuration Release --output publish/backend

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend/

  # ==========================================
  # Job 2：编译前端 Vue3 项目
  # ==========================================
  build-frontend:
    name: build-vue
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: |
          cd frontend
          npm ci

      - name: Lint 检查 + 生产构建
        run: |
          cd frontend
          npm run check

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ==========================================
  # Job 3：构建 Docker 镜像（PR 构建验证；push develop 时额外推送 GHCR）
  # ==========================================
  build-docker:
    name: build-and-push-docker
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载后端构建产物
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish/backend/

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      # PR 时仅构建验证可镜像化（不推送）；push develop 时构建并推送 GHCR
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
