# ============================================================
# CI/CD 自动化流水线（阶段二：编译 → 构建镜像 → 推送 → 部署）
# ============================================================
# 触发器：
#   push develop → 编译 + 构建镜像 + 推送
#   PR master/develop → 仅编译检查（不推送镜像）
#
# 流程：
#   1. 编译后端 .NET 项目 → 输出 dll
#   2. 编译前端项目 → 输出 dist/
#   3. 构建 Docker 应用镜像（后端 + 前端）
#   4. 推送镜像到 GitHub Container Registry
#   5. SSH 到云端服务器 → docker compose 更新部署
# ============================================================

name: Build & Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/dorm-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/dorm-web

jobs:
  # ==========================================
  # Job 1：编译后端 .NET 8 项目
  # ==========================================
  build-backend:
    name: build-dotnet
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原 NuGet 依赖
        run: dotnet restore backend/TemplateDormApi.csproj

      - name: 编译后端项目
        run: dotnet build backend/TemplateDormApi.csproj --configuration Release --no-restore

      - name: 发布后端（输出 dll）
        run: dotnet publish backend/TemplateDormApi.csproj --configuration Release --output publish/backend

      - name: 上传后端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend/

  # ==========================================
  # Job 2：编译前端 Vue3 项目
  # ==========================================
  build-frontend:
    name: build-vue
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 npm 依赖
        run: |
          cd frontend
          npm ci

      - name: Lint 检查 + 生产构建
        run: |
          cd frontend
          npm run check

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ==========================================
  # Job 3：构建 Docker 镜像并推送到 GHCR
  # 仅在 push develop 时执行，PR 跳过
  # ==========================================
  build-docker:
    name: build-and-push-docker
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载后端构建产物
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish/backend/

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest

  # ==========================================
  # Job 4：云端部署（阶段二）
  # SSH 到服务器，拉取最新镜像并重启服务
  # ==========================================
  deploy:
    name: deploy-to-server
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: production

    steps:
      - name: 检出代码（部署配置）
        uses: actions/checkout@v4

      - name: 复制部署配置文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: |
            deploy/docker/docker-compose.yml
            deploy/nginx/nginx.conf
            deploy/nginx/conf.d/dorm-platform.conf
            deploy/scripts/
          target: /opt/dorm-platform/
          strip_components: 1

      - name: 复制数据库脚本到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: database/
          target: /opt/dorm-platform/
          strip_components: 0

      - name: SSH 远程部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/dorm-platform

            # 拉取最新镜像
            docker compose -f docker/docker-compose.yml pull

            # 重启服务
            docker compose -f docker/docker-compose.yml up -d --remove-orphans

            # 清理旧镜像（保留最近 2 个版本）
            docker image prune -af --filter "until=48h"

            # 健康检查
            echo "等待服务就绪..."
            sleep 15
            curl -fsS http://localhost:5000/health > /dev/null && echo "✓ 后端正常" || echo "✗ 后端异常"
            curl -fsS http://localhost:80/ > /dev/null && echo "✓ 前端正常" || echo "✗ 前端异常"
