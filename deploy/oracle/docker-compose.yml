services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: dorm-oracle-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_DATABASE: DORMPDB
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in deploy/oracle/.env}
      APP_USER: DORM_OPER
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in deploy/oracle/.env}
      ORACLE_CHARACTERSET: AL32UTF8
      TZ: Asia/Shanghai
    volumes:
      # 持久化数据，删除容器数据不丢失
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
volumes:
  oracle-data:
