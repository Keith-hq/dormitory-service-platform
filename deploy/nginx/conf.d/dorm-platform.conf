# ============================================================
# 宿主机 Nginx 站点配置 — dorm-platform
# 部署路径：/etc/nginx/conf.d/dorm-platform.conf
#
# 适用场景：
#   - 本文件用于宿主机直接部署的 Nginx（非容器化网关）
#   - 容器化部署时使用 deploy/docker/nginx.conf（已内置于前端镜像）
# ============================================================

# ---- 后端 API 上游定义 ----
upstream dorm_backend {
    # Kestrel 后端（本地容器端口或宿主机进程）
    server 127.0.0.1:5000;
    keepalive 32;
}

# ==========================================
# HTTP 站点（演示/测试用）
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 前端静态文件路径（宿主机部署时指向实际 dist 目录）
    # 容器化部署时此 server 块不启用，使用 dorm-web 容器内的 nginx
    root /opt/dorm-platform/frontend/dist;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源长期缓存（带 hash 的文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代
    location /api/ {
        proxy_pass http://dorm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 大文件上传
        client_max_body_size 10m;
    }

    # Swagger（开发/调试用，生产环境建议关闭）
    location /swagger/ {
        proxy_pass http://dorm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 上传文件回读
    location /uploads/ {
        proxy_pass http://dorm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}

