# ============================================================
# 云端宿主机 Nginx 入口配置（可选：容器化网关替代方案）
#
# 使用场景：
#   - 当不使用容器化的 dorm-web 网关时，在宿主机上直接运行 Nginx
#   - 适用于"后端+数据库容器化 + 前端/网关宿主机托管"混合部署
#
# 部署路径：/etc/nginx/nginx.conf
# 站点配置：/etc/nginx/conf.d/dorm-platform.conf
# ============================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # 基础设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;          # 隐藏 Nginx 版本号
    client_max_body_size 10m;   # 文件上传上限（报修图片等）

    # MIME 类型
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（含请求耗时、上游响应时间）
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               image/svg+xml font/ttf font/otf;

    # 引入站点配置
    include /etc/nginx/conf.d/*.conf;
}
