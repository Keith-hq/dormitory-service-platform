# ============================================================
# 前端容器内 Nginx 配置 — SPA 静态文件 + /api 反代
# 适用于 Docker Compose 内网（dorm-api 服务）
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/xml application/xml+rss
               image/svg+xml;
    gzip_comp_level 6;

    # 安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源（带 hash 的文件名）长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon 等
    location /favicon.ico {
        expires 1w;
        add_header Cache-Control "public";
    }

    # 后端上游：用变量承载 → nginx 延迟到运行时解析 dorm-api 主机名，
    # 构建期 docker build 中执行 nginx -t 时不会因 DNS 解析失败而报错
    set $api_upstream http://dorm-api:5000;

    # API 反代到后端容器
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 大文件上传（报修图片等）
        client_max_body_size 10m;
    }

    # Swagger（开发阶段可访问）
    location /swagger/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }
}
